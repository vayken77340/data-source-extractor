source: test
base_url: https://tb.example.com/api

auth:
  # Basic auth on every request: Authorization: Basic base64(user:pass).
  # No login step, no token exchange.
  type: basic
  username: env:TB_USER
  password: env:TB_PASSWORD

defaults:
  headers: { Accept: application/json }
  timeout: 30
  retries: 2
  rate_limit: 5            # requests/second, source-wide
  limit: 5                 # sampling cap: max values fanned out per endpoint
  max_pages: 20            # hard stop per pagination walk
  output: output/{source}/{endpoint}/{slug}.json

providers:
  asset_types:
    # Generated from input/asset_types.xlsx by tools/build_params.py — regenerate it when
    # the business sends a new sheet, or this runs against the old taxonomy.
    fn: param_file
    args: { path: config/params/asset_types.json, columns: [assetType] }
  asset_measures:
    # Each asset id, paired with the measure types its own assetType selects.
    # `on` is the join: a column in the file, and the param recorded on the envelope.
    fn: from_output_joined
    args:
      endpoint: assets
      # `path` picks the records; `fields` pulls several values off each one, so the id and
      # the name stay on the same row. Two paths over the whole body would drift apart the
      # first time a record had no name.
      path: "$.data[*]"
      fields:
        id: "$.id.id"
        assetName: "$.latest.ENTITY_FIELD.name.value"
      file: config/params/asset_types.json
      join_on: assetType     # also carried onto every row, under this name
      select: measureType

endpoints:

  tenant_info:                          # plain GET, nothing to resolve
    method: GET
    path: /tenant/info

  alarms:                               # GET, static + bound query params
    method: GET
    path: /alarms
    query:
      pageSize: 100
      searchStatus: ACTIVE
      type: { from: asset_types }
    output: output/{source}/alarms/{type}.json

  assets:                               # POST, payload from the parameter file
    method: POST
    path: /assets/search
    payload:
      # The key names the param, so each envelope records `params: {assetType: PUMP}`.
      # That is the join key `measure_keys_for_assets` reads back — renaming it here, or
      # adding `as:`, would leave the join finding nothing.
      assetType: { from: asset_types }
      pageSize: 100
    fan_out: product
    paginate: { style: page_number, at: payload.page, has_more: $.hasNext }
    output: output/{source}/assets/{assetType}_p{page}.json

  measures:                             # GET chained off `assets`, id in path
    method: GET
    path: /assets/{id}/measures
    bind:
      id: { from: asset_measures }      # `fields.id`
    query:
      # `as` because the row's field is named after `select`, not after this key.
      keys: { from: asset_measures, as: measureType }   # "temperature,humidity"
    label:
      # Resolved like any other marker but never sent — these only shape the path below,
      # and are recorded in the envelope's metadata.params.
      assetType: { from: asset_measures }
      assetName: { from: asset_measures }
    limit: 20
    output: output/{source}/measures/{assetType}/{assetName}.json